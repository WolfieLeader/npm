packages:
  - packages/*
  - examples/*
  - tools/*

# One version per shared dev tool, written once. Packages reference it with `catalog:` (https://pnpm.io/catalogs).
# Strict mode makes `pnpm add` refuse a version outside the catalog.
catalogMode: strict

catalog:
  "@arethetypeswrong/core": 0.18.5
  "@oxlint/plugins": 1.90.0
  "@types/node": 26.6.6
  "@types/node-forge": 1.3.14
  cookie: 2.0.1
  esbuild: 0.28.2
  eslint-plugin-regexp: 3.3.3
  fast-check: 4.10.2
  knip: 6.44.1
  node-forge: 1.4.2
  oxfmt: 0.76.0
  oxlint: 1.90.0
  oxlint-tsgolint: 7.0.2005
  publint: 0.3.25
  tsdown: 0.23.4
  tsx: 4.23.15
  turbo: 2.11.10
  typescript: 7.0.2
  vitest: 5.1.0
  workerd: 1.20261102.1

catalogs:
  # The Node.js types of engines.node's floor. `pnpm typecheck` checks every package against them.
  node-floor:
    "@types/node": 20.19.43
  # Example apps only. express4 keeps Express 4 to show the library still works with it.
  express4:
    express: 4.22.3
    "@types/express": 4.17.25
  express5:
    express: 5.3.0
    "@types/express": 5.0.6
  nestjs:
    "@nestjs/common": 12.3.2
    "@nestjs/core": 12.3.2
    "@nestjs/platform-express": 12.3.2
    reflect-metadata: 0.2.2
    rxjs: 7.8.2

# Install scripts. Every listed package runs fine without its script, so all stay off.
# A new package with an install script fails the install until it is reviewed and listed here (https://pnpm.io/settings/build).
allowBuilds:
  "@nestjs/core": false
  esbuild: false
  workerd: false

# A release must be a day old before pnpm installs it.
minimumReleaseAge: 1440
# Waive the wait only for an urgent security patch: list `name@version`, then delete the entry once that version is a day old.
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  # Adopted the day they shipped, by the owner's call. Exact versions only, so later releases wait the full day.
  - oxfmt@0.76.0
  - "@oxfmt/binding-android-arm-eabi@0.76.0"
  - "@oxfmt/binding-android-arm64@0.76.0"
  - "@oxfmt/binding-darwin-arm64@0.76.0"
  - "@oxfmt/binding-darwin-x64@0.76.0"
  - "@oxfmt/binding-freebsd-x64@0.76.0"
  - "@oxfmt/binding-linux-arm-gnueabihf@0.76.0"
  - "@oxfmt/binding-linux-arm-musleabihf@0.76.0"
  - "@oxfmt/binding-linux-arm64-gnu@0.76.0"
  - "@oxfmt/binding-linux-arm64-musl@0.76.0"
  - "@oxfmt/binding-linux-ppc64-gnu@0.76.0"
  - "@oxfmt/binding-linux-riscv64-gnu@0.76.0"
  - "@oxfmt/binding-linux-riscv64-musl@0.76.0"
  - "@oxfmt/binding-linux-s390x-gnu@0.76.0"
  - "@oxfmt/binding-linux-x64-gnu@0.76.0"
  - "@oxfmt/binding-linux-x64-musl@0.76.0"
  - "@oxfmt/binding-openharmony-arm64@0.76.0"
  - "@oxfmt/binding-win32-arm64-msvc@0.76.0"
  - "@oxfmt/binding-win32-ia32-msvc@0.76.0"
  - "@oxfmt/binding-win32-x64-msvc@0.76.0"
  - vitest@5.1.0
  - "@vitest/mocker@5.1.0"
  - "@vitest/spy@5.1.0"

# Fail an install when a package version lost the trust evidence (provenance or trusted publishing) of earlier releases.
trustPolicy: no-downgrade
trustPolicyExcludePrune: true
trustPolicyExclude:
  # Type declarations only, from 2024, before undici-types gained provenance. @types/node 20 (the node-floor catalog)
  # pins ~6.21.0, and only the type check reads it; nothing ships it.
  - undici-types@6.21.0

# `pnpm run` and `pnpm exec` fail when node_modules does not match the lockfile.
verifyDepsBeforeRun: error

# Write exact versions on `pnpm add`.
savePrefix: ""

overrides:
  # minimatch before 11.0.1 has GHSA-g3hv-75wg-m249 (glob DoS). Only eslint pulls it, as the peer of eslint-plugin-regexp
  # that oxlint loads. A floor: any minimatch below 11.0.1 becomes 11.0.3, newer ones stay.
  "minimatch@<11.0.1": 11.0.3
