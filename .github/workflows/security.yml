name: Security

# Every PR runs it, so it can be a required check; it takes under a minute. Weekly, it catches advisories
# published after a dependency landed.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # The checksum is the release's osv-scanner_SHA256SUMS entry, re-hashed on 2026-11-03.
      - name: Install osv-scanner 2.7.0
        env:
          OSV_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/bin/osv-scanner" https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          echo "$OSV_SHA256  $RUNNER_TEMP/bin/osv-scanner" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bin/osv-scanner"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Both pnpm audit commands read pnpm-lock.yaml, so nothing is installed and no package script runs.
      - name: pnpm audit
        run: pnpm audit --audit-level=moderate
      - name: pnpm audit signatures
        if: ${{ !cancelled() }}
        run: pnpm audit signatures
      - name: osv-scanner
        if: ${{ !cancelled() }}
        run: osv-scanner scan source -L pnpm-lock.yaml

  sast:
    name: Opengrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Semgrep's community rules allow internal use with any engine (Semgrep Rules License v1.0).
      # The ref is the develop branch head on 2026-11-03.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: semgrep/semgrep-rules
          ref: 16b9e6d45f10649f6a531ec4838ed9924372c3bc
          path: .semgrep-rules
          persist-credentials: false
      # The checksum is GitHub's asset digest for the release, re-hashed on 2026-11-03.
      - name: Install Opengrep 1.31.0
        env:
          OPENGREP_SHA256: dbbe3c2058dbe600c449a8ba22ea79a1643a6660658400090d0323a8d0d31147
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/bin/opengrep" https://github.com/opengrep/opengrep/releases/download/v1.31.0/opengrep_manylinux_x86
          echo "$OPENGREP_SHA256  $RUNNER_TEMP/bin/opengrep" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bin/opengrep"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Only ERROR-severity rules run, and any finding fails the job. Tests hold deliberate fixtures, so they are skipped.
      - name: Opengrep
        run: >-
          opengrep scan
          --config .semgrep-rules/javascript
          --config .semgrep-rules/typescript
          --severity ERROR
          --error
          --exclude '**/__tests__/**'
          --exclude '**/tests/**'
          packages
