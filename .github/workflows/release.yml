name: Release

# Publishes one package to npm through trusted publishing (OIDC): no npm token exists to leak.
# npm attaches provenance automatically for a public package published from a public repository.
# Runs only when the owner starts it by hand, from main, in the `npm` environment.
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options: [cipher-kit, compress-kit, generate-certs, get-client-ip, modern-cookies]

permissions:
  contents: read

# One group per package: GitHub keeps one pending run per group and cancels older pending ones,
# so a shared group dropped every release queued behind another. Runs for the same package still never overlap.
concurrency:
  group: release-${{ inputs.package }}
  cancel-in-progress: false

env:
  DO_NOT_TRACK: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  publish:
    name: Publish ${{ inputs.package }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read # check out the code
      id-token: write # mint the OIDC token npm exchanges for a one-time publish credential
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Node 26 bundles npm 11.20, above the 11.5.1 that trusted publishing needs.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # The build runs publint and attw; the tests and the packed-tarball smoke test run on what ships.
      - name: Build and test
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          pnpm exec turbo run build test --filter "$PACKAGE"
          pnpm smoke "$PACKAGE"
      # pnpm pack rewrites catalog: and workspace: specifiers; npm publish then handles OIDC and provenance.
      - name: Publish
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          tarball=$(pnpm --filter "$PACKAGE" pack --pack-destination "$RUNNER_TEMP" | tail -n 1)
          npm publish "$tarball" --access public
